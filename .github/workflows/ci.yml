name: WardrobeGenie CI Pipeline

# Trigger the pipeline on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab the code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up a clean Python environment
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip' # Speeds up future runs by caching dependencies

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # We install standard requirements PLUS the testing tools
        pip install -r requirements.txt
        pip install pytest httpx

    # 4. Run the Pytest suite
    - name: Run tests
      run: python -m pytest tests/