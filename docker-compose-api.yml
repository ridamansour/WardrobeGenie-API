name: wardrobegenie-stack

services:
  # 1. The FastAPI ML Serving Backend
  wardrobegenie_api:
    build: .
    container_name: wg_backend
    ports:
      - "8000:8001"
    volumes:
      - ./models:/app/models
      - ./data/user_uploads:/app/public/uploads
    environment:
      - UPLOAD_DIR=public/uploads
      - VECTOR_DB_URL=http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

  # 2. Vector Database for fast semantic search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: wg_vector_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage: